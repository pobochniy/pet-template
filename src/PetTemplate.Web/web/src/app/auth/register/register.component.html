<div class="col-md-offset-3 col-md-6">
  <form class="form-horizontal" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <h4>{{ i18n.t('auth.register.title') }}</h4>
    <hr>
    <!-- Обязательное: логин, пара паролей и пространство. Контакты — под раскрывашкой ниже -->
    <div class="row mb-3">
      <label class="col-md-4 col-form-label" for="userName">{{ i18n.t('core.field.userName') }} *</label>
      <div class="col-md-8">
        <input class="form-control" type="text" id="userName" formControlName="userName" autocomplete="username"
               [attr.maxlength]="userNameMaxLength" />
        <form-validation [model]="registerForm.controls.userName" fieldKey="core.field.userName"></form-validation>
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-md-4 col-form-label" for="password">{{ i18n.t('core.field.password') }} *</label>
      <div class="col-md-8">
        <input class="form-control" type="password" id="password" formControlName="password" autocomplete="new-password" />
        <form-validation [model]="registerForm.controls.password" fieldKey="core.field.password"></form-validation>
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-md-4 col-form-label" for="passwordConfirm">{{ i18n.t('core.field.passwordConfirm') }} *</label>
      <div class="col-md-8">
        <input class="form-control" type="password" id="passwordConfirm" formControlName="passwordConfirm" autocomplete="new-password" />
        <form-validation [model]="registerForm.controls.passwordConfirm" fieldKey="core.field.passwordConfirm"></form-validation>
        @if (registerForm.controls.passwordConfirm.touched && registerForm.hasError('PassNotSame')) {
          <div class="text-danger small mt-1">{{ i18n.t('core.validation.passwordsDoNotMatch') }}</div>
        }
      </div>
    </div>
    <div class="row mb-3">
      @if (!workspaceSkipped()) {
        <label class="col-md-4 col-form-label" for="workspaceName">{{ i18n.t('core.field.workspaceName') }} *</label>
        <div class="col-md-8">
          <input class="form-control" type="text" id="workspaceName" formControlName="workspaceName" />
          <div class="form-text">{{ i18n.t('auth.register.workspaceHint') }}</div>
          <form-validation [model]="registerForm.controls.workspaceName" fieldKey="core.field.workspaceName"></form-validation>
          <button type="button" id="skip-workspace" class="btn btn-link btn-sm p-0 text-muted" (click)="skipWorkspace(true)">
            {{ i18n.t('auth.register.skipWorkspace') }}
          </button>
        </div>
      } @else {
        <div class="col-md-8 offset-md-4">
          <button type="button" id="restore-workspace" class="btn btn-link btn-sm p-0" (click)="skipWorkspace(false)">
            {{ i18n.t('auth.register.createWorkspace') }}
          </button>
        </div>
      }
    </div>

    <!--
      Необязательные поля свёрнуты, как в Lad: на входе видны только логин и пароли,
      и форма не выглядит анкетой. Кнопка, а не галка: галка на форме означает значение,
      которое сохранится, а это переключатель показа
    -->
    <div class="row mb-3">
      <div class="col-md-8 offset-md-4">
        <button type="button" class="btn btn-link btn-sm p-0" id="register-optional-toggle"
                [attr.aria-expanded]="showOptionalFields()" aria-controls="register-optional-fields"
                (click)="toggleOptionalFields()">
          {{ i18n.t('auth.register.moreFields') }}
          <span class="text-muted">— {{ i18n.t('auth.register.moreFieldsHint') }}</span>
        </button>
      </div>
    </div>

    <!--
      Скрываются классом, а не `@if`: поле, заново подключённое к форме, пересчитывает
      проверки и теряет отказ сервера, а введённое при сворачивании не должно пропадать
    -->
    <div id="register-optional-fields" [class.d-none]="!showOptionalFields()">
      <div class="row mb-3">
        <label class="col-md-4 col-form-label" for="phone">{{ i18n.t('core.field.phone') }}</label>
        <div class="col-md-8">
          <input class="form-control" type="tel" id="phone" formControlName="phone" autocomplete="tel" maxlength="12" />
          <form-validation [model]="registerForm.controls.phone" fieldKey="core.field.phone"></form-validation>
        </div>
      </div>
      <div class="row mb-3">
        <label class="col-md-4 col-form-label" for="email">{{ i18n.t('core.field.email') }}</label>
        <div class="col-md-8">
          <input class="form-control" type="email" id="email" formControlName="email" autocomplete="email"
                 [attr.maxlength]="emailMaxLength" />
          <form-validation [model]="registerForm.controls.email" fieldKey="core.field.email"></form-validation>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-8 offset-md-4">
        <button type="submit" class="btn btn-primary" id="register-submit">{{ i18n.t('auth.register.submit') }}</button>
      </div>
    </div>
  </form>
  <!-- Регистрация одним нажатием через Telegram или VK (спец. accounts, 5.1) -->
  <auth-external-buttons></auth-external-buttons>
</div>
