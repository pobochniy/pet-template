# Продукт: сайт и API

# Content-Security-Policy продукта — вторая линия обороны за отрисовщиком markdown (ответы
# ассистента, справка): даже если разметка из модели или статьи прошла бы мимо него, чужой
# скрипт не выполнится. `map` — чтобы политика была одной строкой на весь server-блок и её
# находил `npm run csp:hash`:
# - `script-src` — свои файлы и ровно один инлайн-скрипт `src/index.html` (параметры запуска
#   mini-app) по хешу. Правка скрипта меняет хеш: `npm run csp:hash -- --write` вписывает
#   новый, `npm run csp:hash -- --check` сверяет (хук pre-commit и `web-tests.yml`);
# - `style-src 'unsafe-inline'` — Angular кладёт стили компонентов в `<style>`; без него —
#   только nonce на каждый ответ (`ngCspNonce`), который статикой не отдать;
# - `img-src data:` — значки Bootstrap (стрелка `form-select`, крестик) — `data:`-SVG в CSS;
# - `connect-src 'self'` — клиент ходит только в свой `/api/`; окно Telegram и VK ID —
#   навигация, а не запрос, CSP их не режет;
# - `frame-ancestors` — VK на десктопе и Telegram Web открывают клиент во фрейме mini-app
#   (specs/accounts.md, 5.6): без любого из этих адресов mini-app в площадке не откроется.
#   Поэтому и `X-Frame-Options` нет: он знает только DENY и SAMEORIGIN.
# Проверить политику без риска — заменить заголовок на `Content-Security-Policy-Report-Only`:
# нарушения видны в консоли браузера, ничего не режется.
map $host $csp_product {
    default "default-src 'self'; script-src 'self' 'sha256-q2ClAc7uatg+/dvP3ldIbe5HWsIPkiaOjiVaPi9luiY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://web.telegram.org";
}

server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;
    include /etc/nginx/conf.d/snippets/tls.inc;

    # Выпуск клиента — ссылка current на releases/<sha> (IaC/publish-static.sh, спец.
    # infrastructure, 7): выкатка переключает её целиком, nginx читает её на каждом запросе
    root /etc/nginx/html/current;

    # Без строки nginx режет тело на 1 МБ — раньше API, и загрузка аватара падала бы 413.
    # Самое большое тело API — запись голоса ассистенту: до 4 МБ
    # (AssistantOptions:Transcription:MaxAudioBytes) плюс обёртка multipart
    client_max_body_size 5m;

    # CSP — `map $csp_product` выше, `always` — и на 4xx/5xx. `add_header` в location
    # отменяет унаследованные с server, поэтому блок `index.html` ниже ставит её ещё раз.
    # `frame-ancestors` в ней держит mini-app VK и Telegram живыми; X-Frame-Options нет
    # намеренно — он знает только DENY и SAMEORIGIN и убил бы их
    add_header Content-Security-Policy $csp_product always;

    # Админский API с основного домена не доступен никому (спец. admin, 7): API один,
    # и без этого замок на adminka.example.com обходится через этот же /api/.
    # Регулярка без учёта регистра, а не префикс `/api/Admin/`: маршруты ASP.NET
    # к регистру безразличны, и `/api/admin/Login` иначе прошёл бы мимо
    location ~* ^/api/admin(/|$) {
        deny all;
    }

    location /api/ {
        # `always` — и на ответах 4xx/5xx: без заголовков клиент с другого источника не
        # прочтёт ни 401, ни ошибки валидации — увидит статус 0
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        # Свои заголовки клиента — поимённо: preflight без X-Workspace-Id отрезал бы
        # пространство у запроса с другого источника (specs/authorization.md)
        add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range,X-Workspace-Id' always;
        add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE,PATCH' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        include /etc/nginx/conf.d/snippets/proxy-api.inc;
    }

    # Оболочка клиента всегда сверяется с сервером: иначе браузер держит старый
    # index.html после выкатки и ходит за бандлами, которых уже нет (спец. infrastructure, 8).
    # Сюда же попадают маршруты клиента — через внутренний переход из location / ниже
    location ~ ^/index\.html$ {
        add_header Cache-Control "no-cache";
        # Свой add_header отменил унаследованный с server — CSP повторяется здесь:
        # именно этот ответ (страница клиента) её и несёт
        add_header Content-Security-Policy $csp_product always;
        try_files $uri =404;
    }

    # Бандлы с хешем в имени не меняются никогда — новая версия придёт под новым именем.
    # Нет в текущем выпуске — ищем в прежнем: вкладка, открытая до выкатки, догружает
    # ленивые чанки и шрифты своей версии (спец. infrastructure, 7)
    location ~ ^/(main|polyfills|chunk|styles)-[A-Z0-9]+\.(js|css)$ {
        root /etc/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files /current$uri /previous$uri =404;
    }

    location /media/ {
        root /etc/nginx/html;
        try_files /current$uri /previous$uri =404;
    }

    # /index.html последним, без `=404`: только последний параметр try_files — внутренний
    # переход, и лишь тогда маршрут клиента (/profile) попадает в блок с no-cache выше.
    # С `=404` в конце nginx отдал бы index.html прямо здесь, без заголовка
    location / {
        try_files $uri $uri/ /index.html;
    }
}
