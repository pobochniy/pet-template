# Админка (спец. admin, 2 и 7): своя сборка, тот же API, весь сайт за замком по адресу

# CSP админки — как у продукта (sites/product.conf), но инлайн-скриптов нет и во фрейме её
# не открывает никто. `map` — его находит `npm run csp:hash`
map $host $csp_admin {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adminka.example.com;
    include /etc/nginx/conf.d/snippets/tls.inc;
    include /etc/nginx/conf.d/snippets/admin-lock.inc;

    # Выпуск админки — ссылка current, как у клиента (IaC/publish-static.sh)
    root /etc/nginx/html-admin/current;
    index index.html;

    add_header Content-Security-Policy $csp_admin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        include /etc/nginx/conf.d/snippets/proxy-api.inc;
    }

    # Чанки прежнего выпуска — для вкладки, открытой до выкатки
    location ~ ^/(main|polyfills|chunk|styles)-[A-Z0-9]+\.(js|css)$ {
        root /etc/nginx/html-admin;
        try_files /current$uri /previous$uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
