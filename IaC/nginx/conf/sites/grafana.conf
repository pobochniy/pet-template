# Grafana за шлюзом (спец. admin, 3.3; infrastructure, 10): своих учёток у неё нет, nginx
# на каждый запрос спрашивает API, пускать ли, по куке админки, и сам говорит Grafana, кто пришёл

# Кеш ответов Admin/Auth/Verify: страница Grafana тянет десятки файлов, и без кеша каждый
# стал бы запросом к API
proxy_cache_path /var/cache/nginx/admin-verify levels=1 keys_zone=admin_verify:1m max_size=10m inactive=10m;

# Роль в Grafana — из админских ролей: AdminManagement правит и её, остальным — смотреть
map $admin_roles $grafana_role {
    ~AdminManagement  Admin;
    default           Viewer;
}

# Живой канал Grafana (Grafana Live) ходит по WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.example.com;
    include /etc/nginx/conf.d/snippets/tls.inc;

    # Замок — тот же, что у админки: открыта админка через Admin Access — открыта и Grafana
    include /etc/nginx/conf.d/snippets/admin-lock.inc;

    # Кто пришёл — спрашиваем API. Не вошёл или кука истекла — на вход в админку:
    # кука выдаётся там, и после входа Grafana откроется сама
    auth_request /_admin_verify;
    auth_request_set $admin_login $upstream_http_x_admin_login;
    auth_request_set $admin_roles $upstream_http_x_admin_roles;
    error_page 401 = @admin_login;

    location = /_admin_verify {
        internal;
        auth_request off;
        proxy_pass              http://dapi:8080/api/Admin/Auth/Verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;

        # Минута по значению куки (спец. admin, 3.3): кука живёт час и снятую роль всё равно
        # переживает, так что кеш добавляет к часу минуту, а не новое окно.
        # Кешируется только «да»: отказ без куки иначе делили бы все пришедшие без неё
        proxy_cache             admin_verify;
        proxy_cache_key         $cookie_pettemplate_admin;
        proxy_cache_valid       200 1m;
        proxy_ignore_headers    Cache-Control Expires Set-Cookie;
    }

    location @admin_login {
        auth_request off;
        return 302 https://adminka.example.com/;
    }

    location / {
        # Заголовки ставит только nginx: что бы ни прислал браузер, здесь оно
        # перезаписывается. Поэтому порт Grafana и не проброшен на хост (docker-compose.yml)
        proxy_set_header        X-WEBAUTH-USER $admin_login;
        proxy_set_header        X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $connection_upgrade;

        # Имя разрешается на запросе, а не на старте: без контейнера Grafana nginx
        # иначе не поднялся бы вовсе — и основной сайт вместе с ним.
        # Имя — из сети grafana-gateway, а не grafanacontainer: Grafana верит заголовкам
        # только с адреса nginx в этой сети (GF_AUTH_PROXY_WHITELIST, docker-compose.yml)
        resolver                127.0.0.11 valid=30s;
        set $grafana            http://grafana-gateway:3000;
        proxy_pass              $grafana;
    }
}
