# Вход в конфигурацию nginx: каталог смонтирован в /etc/nginx/conf.d, и nginx подключает
# отсюда только *.conf верхнего уровня — этот файл. Сайты лежат в sites/, общие куски
# server-блоков — в snippets/ (IaC/nginx/README.md)

access_log off;
server_tokens off;

# HTTP — для всех имён одно и то же: проверка certbot и переадресация на HTTPS. Сайт, API,
# админка и Grafana по HTTP не отдаются — вход с паролем и токены ходят только по HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com adminka.example.com grafana.example.com;

    # Проверка certbot: без неё сертификат не выпустится и не продлится
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 308, а не 301: по 301 клиенты повторяют POST как GET без тела, и вызов API по http://
    # сломался бы молча, а не явной ошибкой
    location / {
        return 308 https://$host$request_uri;
    }
}

# Сайты по HTTPS — по файлу на имя. Без сертификата nginx с ними не стартует, поэтому
# на чистой машине IaC/issue-cert.sh на время выпуска комментирует эту строку
include /etc/nginx/conf.d/sites/*.conf;
