access_log off;

# Кеш ответов Admin/Auth/Verify для шлюза к инструментам (спец. admin, 3.3): страница
# Grafana тянет десятки файлов, и без кеша каждый стал бы запросом к API
proxy_cache_path /var/cache/nginx/admin-verify levels=1 keys_zone=admin_verify:1m max_size=10m inactive=10m;

# Роль в Grafana — из админских ролей: AdminManagement правит и её, остальным — смотреть
map $admin_roles $grafana_role {
    ~AdminManagement  Admin;
    default           Viewer;
}

# Живой канал Grafana (Grafana Live) ходит по WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;
    index index.html;
    server_tokens off;

    # Проверка certbot: без неё сертификат основного домена не выпустится и не продлится
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Админский API с основного домена не доступен никому (спец. admin, 7): API один,
    # и без этого замок на adminka.example.com обходится через этот же /api/.
    # Регулярка без учёта регистра, а не префикс `/api/Admin/`: маршруты ASP.NET
    # к регистру безразличны, и `/api/admin/Login` иначе прошёл бы мимо
    location ~* ^/api/admin(/|$) {
        deny all;
    }

    location /api/ {
        proxy_pass              http://dapi:8080/api/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection keep-alive;
        proxy_set_header        Host $host;
        proxy_cache_bypass      $http_upgrade;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

server {
    access_log off;
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens off;

    server_name example.com www.example.com;

    ssl_certificate /etc/nginx/ssl/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/example.com/privkey.pem;

    # Без строки nginx режет тело на 1 МБ — раньше API, и загрузка аватара падала бы 413.
    # Самое большое тело API — запись голоса ассистенту: до 4 МБ
    # (AssistantOptions:Transcription:MaxAudioBytes) плюс обёртка multipart
    client_max_body_size 5m;

    # X-Frame-Options и Content-Security-Policy здесь нет — и это держит mini-app живыми:
    # VK на десктопе и Telegram Web открывают клиент во фрейме (specs/accounts.md, вход
    # через Telegram и VK). Появится CSP — в `frame-ancestors` обязаны быть `https://vk.com
    # https://*.vk.com https://vk.ru https://*.vk.ru https://web.telegram.org`, а
    # X-Frame-Options с ними несовместим вовсе (он знает только DENY и SAMEORIGIN)

    # Админский API с основного домена не доступен никому (спец. admin, 7): API один,
    # и без этого замок на adminka.example.com обходится через этот же /api/.
    # Регулярка без учёта регистра, а не префикс `/api/Admin/`: маршруты ASP.NET
    # к регистру безразличны, и `/api/admin/Login` иначе прошёл бы мимо
    location ~* ^/api/admin(/|$) {
        deny all;
    }

    location /api/ {
        # `always` — и на ответах 4xx/5xx: без заголовков клиент с другого источника не
        # прочтёт ни 401, ни ошибки валидации — увидит статус 0
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        # Свои заголовки клиента — поимённо: preflight без X-Workspace-Id отрезал бы
        # пространство у запроса с другого источника (specs/authorization.md)
        add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range,X-Workspace-Id' always;
        add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE,PATCH' always;

        if ($request_method = 'OPTIONS') {
          return 204;
        }

        proxy_pass              http://dapi:8080/api/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection keep-alive;
        proxy_set_header        Host $host;
        proxy_cache_bypass      $http_upgrade;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # Оболочка клиента всегда сверяется с сервером: иначе браузер держит старый
    # index.html после выкатки и ходит за бандлами, которых уже нет (спец. infrastructure, 8).
    # Сюда же попадают маршруты клиента — через внутренний переход из location / ниже
    location ~ ^/index\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Бандлы с хешем в имени не меняются никогда — новая версия придёт под новым именем
    location ~ ^/(main|polyfills|chunk|styles)-[A-Z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /index.html последним, без `=404`: только последний параметр try_files — внутренний
    # переход, и лишь тогда маршрут клиента (/profile) попадает в блок с no-cache выше.
    # С `=404` в конце nginx отдал бы index.html прямо здесь, без заголовка
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Админка (спец. admin, 2 и 7): своя сборка, тот же API. По http — только
# проверка certbot и переадресация
server {
    listen 80;
    listen [::]:80;
    server_name adminka.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    access_log off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens off;

    server_name adminka.example.com;

    # Сертификат общий с основным доменом: adminka.example.com дописан в него вторым
    # доменом (IaC/DEPLOYMENT.md, «Админка»)
    ssl_certificate /etc/nginx/ssl/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/example.com/privkey.pem;

    root /etc/nginx/html-admin;
    index index.html;

    # Замок на весь блок — и на статику, и на /api/, до всякой авторизации приложения.
    # Маска подхватывает два файла, оба лежат на сервере, а не в репозитории:
    # постоянный список `allow ...;` в conf/admin-allow.inc (на MVP не заводится) и
    # conf/admin-allow-open.inc с `allow all;`, который на время пишет и стирает
    # workflow Admin Access (IaC/DEPLOYMENT.md, «Админка»). Нет ни одного — не
    # открывается никому: include с маской на пустом месте не ошибка, а `deny all` остаётся
    include /etc/nginx/conf.d/admin-allow*.inc;
    deny all;

    location /api/ {
        proxy_pass              http://dapi:8080/api/;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection keep-alive;
        proxy_set_header        Host $host;
        proxy_cache_bypass      $http_upgrade;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# Grafana за шлюзом (спец. admin, 3.3; infrastructure, 10): своих учёток у неё нет,
# nginx на каждый запрос спрашивает API, пускать ли, по куке админки. По http — certbot
# и переадресация
server {
    listen 80;
    listen [::]:80;
    server_name grafana.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    access_log off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens off;

    server_name grafana.example.com;

    # Тот же сертификат, третьим доменом (IaC/DEPLOYMENT.md, «Шлюз к инструментам»)
    ssl_certificate /etc/nginx/ssl/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/example.com/privkey.pem;

    # Замок — тот же, что у админки: открыта админка через Admin Access — открыта и Grafana
    include /etc/nginx/conf.d/admin-allow*.inc;
    deny all;

    # Кто пришёл — спрашиваем API. Не вошёл или кука истекла — на вход в админку:
    # кука выдаётся там, и после входа Grafana откроется сама
    auth_request /_admin_verify;
    auth_request_set $admin_login $upstream_http_x_admin_login;
    auth_request_set $admin_roles $upstream_http_x_admin_roles;
    error_page 401 = @admin_login;

    location = /_admin_verify {
        internal;
        auth_request off;
        proxy_pass              http://dapi:8080/api/Admin/Auth/Verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;

        # Минута по значению куки (спец. admin, 3.3): кука живёт час и снятую роль всё равно
        # переживает, так что кеш добавляет к часу минуту, а не новое окно.
        # Кешируется только «да»: отказ без куки иначе делили бы все пришедшие без неё
        proxy_cache             admin_verify;
        proxy_cache_key         $cookie_pettemplate_admin;
        proxy_cache_valid       200 1m;
        proxy_ignore_headers    Cache-Control Expires Set-Cookie;
    }

    location @admin_login {
        auth_request off;
        return 302 https://adminka.example.com/;
    }

    location / {
        # Заголовки ставит только nginx: что бы ни прислал браузер, здесь оно
        # перезаписывается. Поэтому порт Grafana и не проброшен на хост (docker-compose.yml)
        proxy_set_header        X-WEBAUTH-USER $admin_login;
        proxy_set_header        X-WEBAUTH-ROLE $grafana_role;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection $connection_upgrade;

        # Имя разрешается на запросе, а не на старте: без контейнера Grafana nginx
        # иначе не поднялся бы вовсе — и основной сайт вместе с ним.
        # Имя — из сети grafana-gateway, а не grafanacontainer: Grafana верит заголовкам
        # только с адреса nginx в этой сети (GF_AUTH_PROXY_WHITELIST, docker-compose.yml)
        resolver                127.0.0.11 valid=30s;
        set $grafana            http://grafana-gateway:3000;
        proxy_pass              $grafana;
    }
}

# Инструмент без proxy-auth (приёмник трасс, Jaeger UI и подобные) встаёт так же:
# свой server-блок с тем же замком и тем же auth_request, а своя аутентификация у него
# не включается вовсе — он доступен только через шлюз и показывает всем одно и то же.
# Заголовки X-WEBAUTH-* ему не нужны, порт на хост тоже не пробрасывается
