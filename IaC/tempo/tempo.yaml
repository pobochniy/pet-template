# Tempo одним процессом, трассы на диске в томе (спец. infrastructure, 10).
# Срок — 30 дней, как у метрик в Prometheus: трасса нужна, пока по графику видно,
# когда было медленно
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 720h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
