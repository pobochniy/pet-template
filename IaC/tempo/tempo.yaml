# Tempo одним процессом, трассы на диске в томе (спец. infrastructure, 10).
# Срок — 7 дней: трассу смотрят по свежему следу — разобрать вчерашнюю медленную
# минуту; за месяц трассы занимали бы диск и память компактора на машине в 6 ГБ,
# а тренды за 30 дней остаются в метриках Prometheus
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
