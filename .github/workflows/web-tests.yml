name: Web Tests

# Ворота выкатки клиента: словари и юнит-тесты продукта и админки (спец. infrastructure, 5;
# спец. admin, 4). Своего триггера нет — вызывается из `publish-angular.yml`
# и `publish-admin.yml`, и красный клиент не выкатывается. Сборка с бюджетом бандла
# остаётся там, на self-hosted.
#
# Раннер облачный, а не self-hosted: karma нужен Chrome, а на облачном он уже стоит —
# ставить браузер на машину с продом незачем.

on:
  workflow_call:

env:
  ANGULAR_PROJECT_PATH: src/PetTemplate.Web/web

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/PetTemplate.Web/web
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.ANGULAR_PROJECT_PATH }}/package-lock.json

      # Скрипты на голом node из `tools/`, без единой зависимости, поэтому идут до
      # `npm ci` и стоят секунды.
      #
      # `i18n:check` — сгенерированные словари и `i18n-keys.d.ts` совпадают
      # с закоммиченными. Без этого `prebuild` молча чинит расхождение у себя
      # и собирает, а в репозитории остаются старые.
      - name: Check i18n codegen 🔑
        run: npm run i18n:check

      # `i18n:lint` — в шаблонах нет текста мимо `t()`, в `*.ts` нет строк с кириллицей.
      - name: Lint i18n 🔤
        run: npm run i18n:lint

      # `i18n:codes` — у каждого кода отказа сервера есть ключ в эталонном `en`,
      # а словарь с такими кодами грузится хотя бы одним маршрутом. Парити-тест
      # этого не ловит: он сверяет словари между собой, и кода, которого нет ни
      # в одном, согласованно не видит. Читает `src/PetTemplate.{Api,Services,Shared}/**/*.cs` —
      # поэтому checkout всего репозитория, а не только папки клиента.
      - name: Check server error codes 🧩
        run: npm run i18n:codes

      # `npm ci`, а не `npm install`: ставит ровно то, что записано
      # в `package-lock.json`, и падает при расхождении с `package.json`.
      - name: Install dependencies 📦
        run: npm ci

      # `ng test`, а не `npm test`: тот без флагов уходит в watch и открывает обычный Chrome,
      # а через `pretest` перегенерирует словари — расхождение уже отбил `i18n:check`.
      # Вместе с остальными идёт `i18n-parity.spec.ts` — сверка наборов ключей ru/en.
      # Проект назван явно: в `angular.json` их два — продукт и админка. Имя `pet-template`
      # `dotnet new` не переименовывает
      - name: Test web 🧪
        run: npx ng test pet-template --watch=false --browsers=ChromeHeadless

      # Спеки админки — свой проект в том же `angular.json` (спец. admin, 4). На `pre-push`
      # не вешаются, а здесь идут воротами обеих выкаток: репозиторий один
      - name: Test admin 🧪
        run: npx ng test admin --watch=false --browsers=ChromeHeadless

